[project]
name = "nanoscale-lm"
version = "0.1.0"
description = "A small language model built from scratch (pretrain -> SFT -> alignment) plus a full efficient-inference stack (distillation, quantization, speculative decoding)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NanoScale-LM contributors" }]
keywords = [
    "language-model",
    "transformer",
    "muon",
    "dpo",
    "gptq",
    "speculative-decoding",
    "distillation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "regex>=2023.12",
]

[project.optional-dependencies]
# Everything needed to run the test-suite and the linters.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-regex>=2023.12",
    "pre-commit>=3.7",
]
# Optional extras. None of these are needed for the `nano` CPU path, which is
# what CI and `make smoke` exercise.
data = ["datasets>=2.19", "huggingface-hub>=0.23"]
# External comparison points only -- never imported by `src/nanoscale/`.
# `bitsandbytes` is deliberately not listed: it has no working macOS-ARM wheel, and making
# the whole extra uninstallable for one optional reference number is a bad trade. Install
# it separately on Linux/CUDA if you want the INT8 row.
compare = ["tiktoken>=0.7", "transformers>=4.40"]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6"]
demo = ["gradio>=4.36"]

[project.urls]
Homepage = "https://github.com/vedant1711/nanoscale-lm"
Documentation = "https://vedant1711.github.io/nanoscale-lm/"
Repository = "https://github.com/vedant1711/nanoscale-lm"

[project.scripts]
nanoscale = "nanoscale.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoscale"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # flake8-annotations (we are fully typed)
    "D",   # pydocstyle -- the algorithms must be documented
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "E741",   # `l` is a legitimate name for a logit/length in ML code
    "N803",   # ML math uses capital letters for matrices (X, H, W, Q, K, V)
    "N806",
    "N812",
    "RUF001", # unicode math symbols in docstrings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN401"]
# E402: several scripts must extend sys.path before importing `nanoscale`, so that they
# run from a plain checkout without an editable install. That is a deliberate ordering,
# not an oversight.
"scripts/**" = ["D103", "E402"]
"demo/**" = ["D103"]
# E501: these hand-author SVG, where a single element is legitimately one long line of
# attributes. Wrapping them would hurt readability rather than help it. Everything else,
# including the annotation rules, still applies.
"site-src/**" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
# `**metrics: Any` on a logging/metrics sink is the correct signature, not a smell.
allow-star-arg-any = true

[tool.mypy]
# Deliberately *not* pinning `python_version`. Pinning it to "3.11" makes mypy apply
# 3.11 syntax rules to whatever stubs are installed -- and on a 3.12 interpreter the
# numpy stubs use PEP 695 `type` statements, which mypy then rejects as a syntax error in
# a third-party file we do not control. Letting mypy follow the running interpreter keeps
# the CI matrix meaningful: each Python version is checked against its own stubs.
# `requires-python = ">=3.11"` above is what actually constrains the language level.
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
# Optional extras that CI does not install. `scripts/external_baseline.py` imports
# `transformers` lazily inside a function precisely so the module stays importable
# without it, but mypy still resolves the import statically.
module = [
    "matplotlib.*",
    "datasets.*",
    "tiktoken.*",
    "transformers.*",
    "bitsandbytes.*",
    "gradio.*",
    "hypothesis.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that take more than ~10s (deselect with '-m \"not slow\"')",
    "gpu: tests that require CUDA",
    "network: tests that require network access",
]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.coverage.run]
source = ["src/nanoscale"]
branch = true
